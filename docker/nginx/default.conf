server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;   # Laravel's web root (matches docker-compose working_dir + /public)
    index index.php index.html;

    # Serve existing files (CSS, JS, images) directly
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass all PHP requests to PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass app:9000;          # "app" = service name in docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}